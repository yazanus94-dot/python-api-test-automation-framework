[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-api-test-automation-framework"
version = "1.0.0"
description = "Professional Python REST API test automation framework with a FastAPI system under test"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "PyJWT>=2.8",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "requests>=2.31",
  "pytest-html>=4.1",
  "jsonschema>=4.21",
  "ruff==0.8.6",
  "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "qa_framework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --html=reports/report.html --junitxml=reports/junit.xml"
markers = [
  "smoke: fast critical-path checks",
  "regression: full functional regression coverage",
  "authentication: JWT login and authorization checks",
  "negative: malformed, unauthorized and unsupported requests",
  "contract: OpenAPI and schema validation",
  "integration: multi-step HTTP scenarios",
  "unit: framework/utility checks without HTTP",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "venv", "reports", "data", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["tests/", "data/", "reports/"]
